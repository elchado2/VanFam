<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VanFam Pantry & Shopping List</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --surface-dark: #141414;
            --surface-card: #1c1c1e;
            --accent-orange: #ff5722;
            --accent-gold: #ffb703;
            --text-main: #f2f2f7;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        #app-header {
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            color: var(--accent-orange);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        .header-title {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
        }

        .tab-bar {
            display: flex;
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent-orange);
            border-bottom-color: var(--accent-orange);
        }

        .main-container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .scan-banner {
            background: linear-gradient(180deg, rgba(255,87,34,0.12) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .mode-btn.active {
            background-color: var(--accent-orange);
            color: #ffffff;
            border-color: var(--accent-orange);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-orange);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .action-btn.secondary {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            margin-top: 10px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
        }

        .input-group button {
            padding: 12px 18px;
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .list-card {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .shop-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        .shop-item-left input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-orange);
        }

        .item-title {
            font-size: 14px;
            font-weight: 600;
        }

        .item-title.checked {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            color: #ffffff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }

        .qty-count {
            font-weight: 700;
            color: var(--accent-gold);
            min-width: 20px;
            text-align: center;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff453a;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Scanner Modal */
        #scanner-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.9);
            z-index: 500;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #reader-container {
            width: 100%;
            max-width: 400px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .close-scanner-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #ff453a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="app-header">
        <a href="index.html" class="back-link">&larr; Hub</a>
        <div class="header-title">VanFam Pantry</div>
        <div></div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tab-btn-pantry" onclick="switchTab('pantry')">Pantry Inventory</button>
        <button class="tab-btn" id="tab-btn-shopping" onclick="switchTab('shopping')">Shopping List</button>
    </div>

    <div class="main-container">
        
        <!-- PANTRY VIEW -->
        <div id="pantry-view" class="tab-content active">
            <div class="scan-banner">
                <div class="mode-selector">
                    <button class="mode-btn active" id="mode-in" onclick="setScanMode('IN')">+ IN (Stock)</button>
                    <button class="mode-btn" id="mode-out" onclick="setScanMode('OUT')">- OUT (Used)</button>
                    <button class="mode-btn" id="mode-low" onclick="setScanMode('LOW')">🛒 LOW (To List)</button>
                </div>
                <button class="action-btn" onclick="startScanner()">📷 Scan Barcode</button>
            </div>

            <div class="input-group">
                <input type="text" id="manual-pantry-input" placeholder="Add custom item to pantry...">
                <button onclick="addManualPantryItem()">+ Add</button>
            </div>

            <div id="pantry-list"></div>
        </div>

        <!-- SHOPPING LIST VIEW -->
        <div id="shopping-view" class="tab-content">
            <div style="margin-bottom: 16px; display: flex; gap: 8px;">
                <button class="action-btn secondary" style="margin: 0; flex: 1;" onclick="copyListForNotes()">📋 Copy for Notes</button>
                <button class="action-btn secondary" style="margin: 0; flex: 1; border-color: #ff453a; color: #ff453a;" onclick="clearShoppingList()">🗑️ Clear</button>
            </div>

            <div class="input-group">
                <input type="text" id="manual-shop-input" placeholder="Add item to shopping list...">
                <button onclick="addManualShoppingItem()">+ Add</button>
            </div>

            <div id="shopping-list-items"></div>
        </div>

    </div>

    <!-- SCANNER MODAL -->
    <div id="scanner-modal">
        <div id="reader-container"></div>
        <button class="close-scanner-btn" onclick="stopScanner()">Close Camera</button>
    </div>

    <script>
        const safeStorage = {
            getItem(key) {
                try { return localStorage.getItem(key); }
                catch (e) { return window[key] || null; }
            },
            setItem(key, value) {
                try { localStorage.setItem(key, value); }
                catch (e) { window[key] = value; }
            }
        };

        let pantryItems = JSON.parse(safeStorage.getItem('vanfam_pantry_items') || '[]');
        let shoppingList = JSON.parse(safeStorage.getItem('vanfam_master_shopping_list') || '[]');
        let currentScanMode = 'IN';
        let html5QrCode = null;

        document.addEventListener('DOMContentLoaded', () => {
            // Check if arriving with ?tab=shopping parameter
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('tab') === 'shopping' || window.location.hash === '#shopping') {
                switchTab('shopping');
            }
            initScanner();
            renderPantry();
            renderShoppingList();
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'pantry') {
                document.getElementById('tab-btn-pantry').classList.add('active');
                document.getElementById('pantry-view').classList.add('active');
            } else if (tabName === 'shopping') {
                document.getElementById('tab-btn-shopping').classList.add('active');
                document.getElementById('shopping-view').classList.add('active');
            }
        }

        function setScanMode(mode) {
            currentScanMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode.toLowerCase()}`).classList.add('active');
        }

        function initScanner() {
            html5QrCode = new Html5Qrcode("reader-container");
        }

        function startScanner() {
            document.getElementById('scanner-modal').style.display = 'flex';
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                onScanSuccess
            ).catch(err => {
                alert("Camera permission denied or unavailable.");
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-modal').style.display = 'none';
                });
            } else {
                document.getElementById('scanner-modal').style.display = 'none';
            }
        }

        function onScanSuccess(decodedText) {
            stopScanner();
            fetchProductFromUPC(decodedText);
        }

        function fetchProductFromUPC(upc) {
            fetch(`https://world.openfoodfacts.org/api/v2/product/${upc}.json`)
                .then(res => res.json())
                .then(data => {
                    let title = "Scanned Item";
                    if (data.status === 1 && data.product) {
                        title = data.product.product_name || data.product.brands || "Scanned Item";
                    } else {
                        title = prompt("Item not found in database. Enter name:", `Item (${upc})`) || `Item (${upc})`;
                    }
                    processScannedItem(upc, title);
                })
                .catch(() => {
                    const title = prompt("Network error. Enter item name:", `Item (${upc})`) || `Item (${upc})`;
                    processScannedItem(upc, title);
                });
        }

        function processScannedItem(upc, name) {
            if (currentScanMode === 'IN') {
                const existing = pantryItems.find(i => i.upc === upc || i.name === name);
                if (existing) { existing.qty += 1; }
                else { pantryItems.push({ upc, name, qty: 1 }); }
                savePantry();
            } else if (currentScanMode === 'OUT') {
                const index = pantryItems.findIndex(i => i.upc === upc || i.name === name);
                if (index !== -1) {
                    pantryItems[index].qty -= 1;
                    if (pantryItems[index].qty <= 0) pantryItems.splice(index, 1);
                }
                savePantry();
            } else if (currentScanMode === 'LOW') {
                const existing = shoppingList.find(i => i.name === name);
                if (!existing) { shoppingList.push({ id: Date.now(), name: name, checked: false }); }
                saveShopping();
                switchTab('shopping');
            }
        }

        function addManualPantryItem() {
            const input = document.getElementById('manual-pantry-input');
            const val = input.value.trim();
            if (!val) return;
            const existing = pantryItems.find(i => i.name.toLowerCase() === val.toLowerCase());
            if (existing) { existing.qty += 1; }
            else { pantryItems.push({ upc: null, name: val, qty: 1 }); }
            input.value = '';
            savePantry();
        }

        function addManualShoppingItem() {
            const input = document.getElementById('manual-shop-input');
            const val = input.value.trim();
            if (!val) return;
            shoppingList.push({ id: Date.now(), name: val, checked: false });
            input.value = '';
            saveShopping();
        }

        function updatePantryQty(index, delta) {
            pantryItems[index].qty += delta;
            if (pantryItems[index].qty <= 0) pantryItems.splice(index, 1);
            savePantry();
        }

        function toggleShoppingItem(index) {
            shoppingList[index].checked = !shoppingList[index].checked;
            saveShopping();
        }

        function removeShoppingItem(index) {
            shoppingList.splice(index, 1);
            saveShopping();
        }

        function clearShoppingList() {
            if (confirm("Clear all items from your shopping list?")) {
                shoppingList = [];
                saveShopping();
            }
        }

        function copyListForNotes() {
            if (shoppingList.length === 0) return alert("Shopping list is empty!");
            const text = "VANFAM GROCERY LIST:\n" + shoppingList.map(i => `${i.checked ? '[x]' : '[ ]'} ${i.name}`).join('\n');
            navigator.clipboard.writeText(text).then(() => alert("Shopping list copied to clipboard!"));
        }

        function savePantry() {
            safeStorage.setItem('vanfam_pantry_items', JSON.stringify(pantryItems));
            renderPantry();
        }

        function saveShopping() {
            safeStorage.setItem('vanfam_master_shopping_list', JSON.stringify(shoppingList));
            renderShoppingList();
        }

        function renderPantry() {
            const container = document.getElementById('pantry-list');
            container.innerHTML = pantryItems.length === 0 
                ? '<div class="empty-state">No items in pantry. Tap "Scan Barcode" or add manually above.</div>'
                : pantryItems.map((item, idx) => `
                    <div class="list-card">
                        <div class="item-title">${item.name}</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updatePantryQty(${idx}, -1)">-</button>
                            <span class="qty-count">${item.qty}</span>
                            <button class="qty-btn" onclick="updatePantryQty(${idx}, 1)">+</button>
                        </div>
                    </div>
                `).join('');
        }

        function renderShoppingList() {
            const container = document.getElementById('shopping-list-items');
            container.innerHTML = shoppingList.length === 0
                ? '<div class="empty-state">Shopping list is clear!</div>'
                : shoppingList.map((item, idx) => `
                    <div class="list-card">
                        <div class="shop-item-left" onclick="toggleShoppingItem(${idx})">
                            <input type="checkbox" ${item.checked ? 'checked' : ''}>
                            <span class="item-title ${item.checked ? 'checked' : ''}">${item.name}</span>
                        </div>
                        <button class="delete-btn" onclick="removeShoppingItem(${idx})">✕</button>
                    </div>
                `).join('');
        }
    </script>
</body>
</html>
