<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VanFam Cookbook</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --surface-dark: #141414;
            --surface-card: #1c1c1e;
            --accent-orange: #ff5722;
            --accent-gold: #ffb703;
            --text-main: #f2f2f7;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        #app-header {
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--accent-orange);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            user-select: none;
        }

        .header-text h1 {
            font-size: 18px;
            color: #ffffff;
            margin: 0;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header-text p {
            font-size: 11px;
            color: var(--text-muted);
            margin: 2px 0 0 0;
        }

        #nav-drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background-color: var(--surface-dark);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 200;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        #nav-drawer.open {
            left: 0;
        }

        .drawer-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(255,87,34,0.05) 0%, rgba(0,0,0,0) 100%);
        }

        .drawer-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--accent-orange);
        }

        .drawer-header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .index-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .index-item {
            display: flex;
            flex-direction: column;
            padding: 14px;
            background-color: #1c1c1e;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: background-color 0.2s;
        }

        .index-item.active {
            border-left-color: var(--accent-orange);
            background-color: #242426;
        }

        .index-item h3 {
            margin: 0 0 4px 0;
            font-size: 14px;
            color: #ffffff;
        }

        .index-item span {
            font-size: 11px;
            color: var(--accent-gold);
        }

        #drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 150;
            display: none;
        }

        #drawer-overlay.show {
            display: block;
        }

        #main-content {
            padding: 16px;
        }

        .recipe-view {
            display: none;
        }

        .recipe-view.active {
            display: block;
        }

        .recipe-banner {
            background: linear-gradient(180deg, rgba(255,87,34,0.08) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .recipe-title {
            font-size: 22px;
            margin: 0 0 8px 0;
            color: #ffffff;
            font-weight: 800;
        }

        .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            background-color: #242426;
            color: var(--accent-gold);
            border: 1px solid var(--border-color);
        }

        .scaler-box {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scaler-title {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
        }

        .scaler-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .scaler-btn {
            background-color: #2c2c2e;
            color: #ffffff;
            border: 1px solid #444;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
        }

        .portion-display {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-orange);
            min-width: 80px;
            text-align: center;
        }

        h2 {
            font-size: 15px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 24px 0 12px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .ingredient-group-title {
            font-size: 11px;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin: 14px 0 6px 0;
            font-weight: bold;
        }

        .item-row {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .item-row input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--accent-orange);
            cursor: pointer;
        }

        .item-text {
            font-size: 13.5px;
            line-height: 1.4;
        }

        .item-row input:checked + .item-text {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .step-card {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            cursor: pointer;
        }

        .step-card.completed {
            border-color: #30d158;
            background-color: rgba(48, 209, 88, 0.03);
        }

        .step-badge {
            background-color: #2c2c2e;
            color: var(--accent-gold);
            font-size: 10px;
            font-weight: 700;
            padding: 4px 6px;
            border-radius: 4px;
            height: fit-content;
        }

        .step-card.completed .step-badge {
            background-color: #30d158;
            color: #000000;
        }

        .step-body {
            flex: 1;
        }

        .step-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .step-card.completed .step-title {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .step-desc {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-main);
        }

        .step-card.completed .step-desc {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Main Dynamic Toolbar Header -->
    <div id="app-header">
        <button class="menu-btn" onclick="toggleDrawer()">☰</button>
        <div class="header-text">
            <h1>VanFam Cookbook</h1>
            <p id="current-recipe-subtitle">Laphroaig Bison Chili</p>
        </div>
    </div>

    <!-- Dropdown Overlay Background -->
    <div id="drawer-overlay" onclick="toggleDrawer()"></div>

    <!-- Navigation Menu Index Drawer -->
    <div id="nav-drawer">
        <div class="drawer-header">
            <h2>Recipe Index</h2>
            <p>VanFam Master Collection</p>
        </div>
        <div class="index-list">
            <div class="index-item active" id="tab-chili" onclick="switchRecipe('chili', 'Laphroaig Bison Chili')">
                <h3>Laphroaig Bison Chili</h3>
                <span>Ninja Slow Cooker • Stew</span>
            </div>
            <div class="index-item" id="tab-pork" onclick="switchRecipe('pork', 'Smoked Pulled Pork')">
                <h3>Smoked Pulled Pork</h3>
                <span>Wood Smoker • Low & Slow</span>
            </div>
        </div>
    </div>

    <!-- Primary Display Container Layout -->
    <div id="main-content">

        <!-- ================= RECIPE 1: CHILI INTERFACE ================= -->
